name: TestFlight

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: true

jobs:
  testflight:
    runs-on: macos-15
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Check signing secrets
        id: check
        run: |
          missing=""
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_CONTENT TEAM_ID; do
            [ -z "${!v}" ] && missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::warning::TestFlight skipped — missing secrets:$missing"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.skip != 'true'

      - name: Pick newest Xcode
        if: steps.check.outputs.skip != 'true'
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"

      - name: Generate Xcode project
        if: steps.check.outputs.skip != 'true'
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Write API key
        if: steps.check.outputs.skip != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          KEY="$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
          # Rebuild a clean PEM no matter how the key was pasted (lost line
          # breaks, Windows line endings, extra spaces, missing header).
          BODY=$(printf '%s' "$ASC_KEY_CONTENT" | tr -d '\r' \
            | sed -e 's/-----BEGIN [A-Z ]*-----//g' -e 's/-----END [A-Z ]*-----//g' \
            | tr -cd 'A-Za-z0-9+/=')
          { echo "-----BEGIN PRIVATE KEY-----"; echo "$BODY" | fold -w 64; echo "-----END PRIVATE KEY-----"; } > "$KEY"
          echo "Key body length: ${#BODY} characters (a valid key is about 200)."
          if ! openssl pkey -in "$KEY" -noout 2>/dev/null; then
            echo "::error::The ASC_KEY_CONTENT secret isn't a valid private key (body is ${#BODY} characters; expected about 200). Re-copy the whole .p8 file text into the secret."
            exit 1
          fi
          # Re-encode to canonical PKCS#8 (drops any stray characters that
          # were pasted along with the key; Xcode's parser is strict).
          openssl pkey -in "$KEY" -out "$KEY.clean"
          openssl pkcs8 -topk8 -nocrypt -in "$KEY.clean" -out "$KEY"
          rm -f "$KEY.clean"
          KTYPE=$(openssl pkey -in "$KEY" -noout -text 2>/dev/null | head -1)
          echo "Key type: $KTYPE"
          case "$KTYPE" in
            *256*) ;;
            *) echo "::error::This isn't an App Store Connect API key (expected a 256-bit EC key, got: $KTYPE). Make sure ASC_KEY_CONTENT holds the AuthKey_….p8 text." ; exit 1 ;;
          esac
          printf 'Key ID length: %s (should be 10)\n' "$(printf '%s' "$ASC_KEY_ID" | tr -d '[:space:]' | wc -c)"
          echo "KEY_PATH=$KEY" >> "$GITHUB_ENV"

      - name: Archive (signed with HealthKit)
        if: steps.check.outputs.skip != 'true'
        run: |
          xcodebuild -project SkiSteps.xcodeproj -scheme SkiSteps \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/SkiSteps.xcarchive archive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} > archive.log 2>&1 || {
              grep -E "error:|Error " archive.log | sort -u | head -30 | while IFS= read -r line; do echo "::error::${line//$HOME/}"; done
              tail -50 archive.log
              exit 1
            }

      - name: Upload to TestFlight
        if: steps.check.outputs.skip != 'true'
        run: |
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/SkiSteps.xcarchive \
            -exportOptionsPlist ExportOptions.plist -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" > export.log 2>&1 || {
              grep -iE "error" export.log | sort -u | head -30 | while IFS= read -r line; do echo "::error::${line//$HOME/}"; done
              tail -50 export.log
              exit 1
            }
          echo "::notice::Build ${{ github.run_number }} uploaded to TestFlight. It appears in the TestFlight app after Apple finishes processing (usually 10–30 minutes)."
