name: SkiSteps
options:
  bundleIdPrefix: com.ski
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: ""
targets:
  SkiSteps:
    type: application
    platform: iOS
    sources:
      - path: SkiSteps
      - path: Shared
    dependencies:
      - target: SkiStepsWidget
    entitlements:
      path: SkiSteps/SkiSteps.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.healthkit.background-delivery: true
        com.apple.security.application-groups:
          - group.com.ski.steps
    info:
      path: SkiSteps/Info.plist
      properties:
        CFBundleDisplayName: Ski Steps
        NSHealthShareUsageDescription: Ski Steps reads your steps, walking distance, flights climbed and active energy from Apple Health to show your daily progress and history.
        NSHealthUpdateUsageDescription: Ski Steps does not write any data to Apple Health.
        UILaunchScreen:
          UIColorName: AccentColor
        UIRequiredDeviceCapabilities: [healthkit]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
        LSApplicationQueriesSchemes: [x-apple-health]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ski.steps
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme: {}
  SkiStepsWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: SkiStepsWidget
      - path: Shared
    entitlements:
      path: SkiStepsWidget/SkiStepsWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.ski.steps
    info:
      path: SkiStepsWidget/Info.plist
      properties:
        CFBundleDisplayName: Ski Steps
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ski.steps.widget
        SKIP_INSTALL: YES
