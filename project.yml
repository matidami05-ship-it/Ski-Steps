name: SkiSteps
options:
  bundleIdPrefix: com.skistudio
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: ""
targets:
  SkiSteps:
    type: application
    platform: iOS
    sources:
      - path: SkiSteps
      - path: Shared
    dependencies:
      - target: SkiStepsWidget
      - target: SkiStepsWatch
    entitlements:
      path: SkiSteps/SkiSteps.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.healthkit.background-delivery: true
        com.apple.security.application-groups:
          - group.com.skistudio.steps
    info:
      path: SkiSteps/Info.plist
      properties:
        CFBundleDisplayName: Ski Steps
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        NSHealthShareUsageDescription: Ski Steps reads your steps, walking distance, flights climbed, active energy, exercise time and workouts (including swims) from Apple Health to show your progress, goals and history.
        NSHealthUpdateUsageDescription: Ski Steps saves the runs you record or confirm to Apple Health, with distance, calories and route.
        NSLocationWhenInUseUsageDescription: Ski Steps uses your location while you record a run to map your route and measure distance and pace.
        NSLocationAlwaysAndWhenInUseUsageDescription: Ski Steps records your route in the background while you walk or run, so detected walks and runs are saved with a map. GPS only turns on while you're moving on foot or by bike.
        NSMotionUsageDescription: Ski Steps uses motion data to detect runs you didn't record, so you can save them.
        UIBackgroundModes: [location, audio]
        UILaunchScreen:
          UIColorName: AccentColor
        UIRequiredDeviceCapabilities: [healthkit]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        UIUserInterfaceStyle: Dark
        LSApplicationQueriesSchemes: [x-apple-health]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.skistudio.steps
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme: {}
  SkiStepsWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: SkiStepsWidget
      - path: Shared
    entitlements:
      path: SkiStepsWidget/SkiStepsWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.skistudio.steps
    info:
      path: SkiStepsWidget/Info.plist
      properties:
        CFBundleDisplayName: Ski Steps
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.skistudio.steps.widget
        SKIP_INSTALL: YES
  SkiStepsWatch:
    type: application
    platform: watchOS
    sources:
      - path: SkiStepsWatch
      - path: Shared
    entitlements:
      path: SkiStepsWatch/SkiStepsWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    info:
      path: SkiStepsWatch/Info.plist
      properties:
        CFBundleDisplayName: Ski Steps
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.skistudio.steps
        NSHealthShareUsageDescription: Ski Steps reads your steps, distance, calories, exercise time and heart rate to show your progress and live workout stats.
        NSHealthUpdateUsageDescription: Ski Steps saves the workouts you record on Apple Watch to Apple Health.
        NSLocationWhenInUseUsageDescription: Ski Steps uses your location during outdoor workouts to map your route and measure distance.
        WKBackgroundModes: [workout-processing]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.skistudio.steps.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
